<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PrintAir — Print, delivered</title>
    <meta
      name="description"
      content="PrintAir is your AI printing partner in the Philippines. Post a print or packaging project, compare quotations from verified printing partners, and track it to delivery."
    />

    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f5fa" />

    <!-- Lets the installed app run full-screen on iPhone and iPad. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PrintAir" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="PrintAir — Print, delivered" />
    <meta
      property="og:description"
      content="Bring your idea. We'll work out the printing. AI-guided print and packaging projects with trusted Philippine manufacturing partners."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PrintAir" />
    <meta property="og:url" content="__APP_URL__/" />
    <meta property="og:image" content="__APP_URL__/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app takes over, so a slow or failed start is never a silent blank page. -->
      <div id="boot" style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; font-family: system-ui, sans-serif; background: #f6f5fa; color: #565070">
        <img src="/brand/wordmark.png?v=2" alt="PrintAir" style="height: 18px; width: auto" />
        <div id="boot-status">Loading…</div>
      </div>
    </div>
    <noscript>PrintAir needs JavaScript turned on to run.</noscript>
    <script>
      // If the app fails before it can draw anything, say so on screen instead of staying blank.
      (function () {
        function show(message) {
          var boot = document.getElementById('boot-status');
          if (!boot) return; // the app has already taken over; its own error screen handles it
          boot.innerHTML =
            '<b style="color:#b01524">PrintAir could not start.</b><br><br><code style="font-size:13px;word-break:break-word">' +
            String(message).replace(/</g, '&lt;') +
            '</code><br><br>Try a hard refresh (Ctrl+Shift+R). If this stays, send this message to whoever set the app up.';
        }
        window.__printairBootError = show;
        window.addEventListener('error', function (e) { show(e.message || 'A script failed to load.'); });
        window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || e.reason || 'Unknown error'); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
